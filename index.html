/* ---------------------------------------------------------------------- */
/*  Trung tâm — chủ trung tâm xếp lớp cho nhiều giáo viên                  */
/*  Dữ liệu lịch cá nhân của mỗi giáo viên KHÔNG đổi (vẫn ở users/{uid}).  */
/*  Thêm collection centers/{id} + members/{uid} + invites + assignments. */
/* ---------------------------------------------------------------------- */

function AssignmentGrid({ busySlots, assignments, onCreateDraft, onSelectAssignment }) {
  const rowH = 26;
  const labelW = 46;
  const pxPerMin = rowH / 60;
  const totalHeight = HOURS.length * rowH;
  const dragRef = useRef(null);
  const draftValueRef = useRef(null);
  const [draft, setDraft] = useState(null);

  const minuteAtY = (y) => {
    const raw = DAY_START_MIN + y / pxPerMin;
    return Math.min(DAY_END_MIN, Math.max(DAY_START_MIN, roundToStep(raw)));
  };

  const handleMouseDown = (day) => (e) => {
    if (e.target !== e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const m = minuteAtY(e.clientY - rect.top);
    dragRef.current = { day, startMin: m, top: rect.top };
    const next = { day, s: m, e: m };
    draftValueRef.current = next;
    setDraft(next);
  };

  useEffect(() => {
    const handleMove = (e) => {
      if (!dragRef.current) return;
      const { day, startMin, top } = dragRef.current;
      const m = minuteAtY(e.clientY - top);
      const next = { day, s: Math.min(startMin, m), e: Math.max(startMin, m) };
      draftValueRef.current = next;
      setDraft(next);
    };
    const handleUp = () => {
      if (!dragRef.current) return;
      dragRef.current = null;
      const d = draftValueRef.current;
      draftValueRef.current = null;
      setDraft(null);
      if (d && d.e - d.s >= TIME_STEP_MIN) onCreateDraft(d.day, d.s, d.e);
    };
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleUp);
    return () => {
      window.removeEventListener("mousemove", handleMove);
      window.removeEventListener("mouseup", handleUp);
    };
  }, [onCreateDraft]);

  return (
    <div className="overflow-x-auto">
      <div className="flex select-none" style={{ minWidth: 560 }}>
        <div style={{ width: labelW, flexShrink: 0 }}>
          <div style={{ height: 20 }} />
          <div style={{ position: "relative", height: totalHeight }}>
            {HOURS.map((h) => (
              <div key={h} style={{ position: "absolute", top: (h - HOUR_START) * rowH - 6, right: 4, fontSize: 9.5, color: MUTED_LIGHT }}>{h}:00</div>
            ))}
          </div>
        </div>
        {DAYS.map((d, di) => (
          <div key={d.short} style={{ flex: 1, minWidth: 56 }}>
            <div className="flex items-end justify-center pb-1 text-[10.5px] font-semibold" style={{ height: 20, color: PRIMARY, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>{d.short}</div>
            <div
              className="daycol"
              onMouseDown={handleMouseDown(di)}
              style={{
                position: "relative", height: totalHeight, cursor: "crosshair",
                backgroundColor: "#FFFCFD",
                backgroundImage: `repeating-linear-gradient(to bottom, #FBEAF1 0, #FBEAF1 1px, transparent 1px, transparent ${rowH}px)`,
                borderLeft: di === 0 ? "1px solid #FBEAF1" : "1px solid #FDF3F7",
                borderRight: "1px solid #FDF3F7",
              }}
            >
              {(busySlots[di] || []).map((b) => (
                <div key={"busy-" + b.id} style={{ position: "absolute", left: 1, right: 1, top: (b.s - DAY_START_MIN) * pxPerMin, height: Math.max(4, (b.e - b.s) * pxPerMin), backgroundColor: "#FBD9E7", opacity: 0.65, borderRadius: 4, pointerEvents: "none" }} title="Khung giờ bận cá nhân" />
              ))}
              {(assignments[di] || []).map((a) => (
                <div
                  key={a.id}
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={(e) => { e.stopPropagation(); onSelectAssignment(di, a); }}
                  title={a.className || "Lớp học"}
                  className="absolute left-0.5 right-0.5 cursor-pointer overflow-hidden rounded-md border px-1 py-0.5 text-[9.5px] leading-tight hover:brightness-95"
                  style={{ top: (a.s - DAY_START_MIN) * pxPerMin, height: Math.max(8, (a.e - a.s) * pxPerMin), backgroundColor: "#FFE7CC", borderColor: "#FFA94D", color: "#8A5A12", zIndex: 2 }}
                >
                  <span className="font-semibold">{minToHHMM(a.s)}–{minToHHMM(a.e)}</span>
                  {a.className && <div className="truncate opacity-90">{a.className}</div>}
                </div>
              ))}
              {draft && draft.day === di && (
                <div className="absolute left-0.5 right-0.5 rounded-md border-2 border-dashed" style={{ top: (draft.s - DAY_START_MIN) * pxPerMin, height: Math.max(4, (draft.e - draft.s) * pxPerMin), borderColor: "#FFA94D", backgroundColor: "#FFE7CC99" }} />
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AssignmentEditForm({ editing, setEditing, centerId, teacherUid, busySlots, assignments, notify }) {
  const [className, setClassName] = useState(editing.className || "");
  const [sVal, setSVal] = useState(minToHHMM(editing.s));
  const [eVal, setEVal] = useState(minToHHMM(editing.e));

  useEffect(() => {
    setClassName(editing.className || "");
    setSVal(minToHHMM(editing.s));
    setEVal(minToHHMM(editing.e));
  }, [editing.id]);

  const handleSave = async () => {
    const s = roundToStep(hhmmToMin(sVal));
    const e = roundToStep(hhmmToMin(eVal));
    const [cs, ce] = clampRange(s, e);
    if (ce <= cs) { notify("Giờ kết thúc phải sau giờ bắt đầu.", "error"); return; }
    if (!isRangeFreeOfBusy(busySlots, editing.day, cs, ce)) { notify("Trùng với khung giờ bận cá nhân của giáo viên.", "error"); return; }
    if (!isRangeFreeOfBusy(assignments, editing.day, cs, ce, editing.id)) { notify("Trùng với 1 lớp khác đã xếp cho giáo viên này.", "error"); return; }
    try {
      await db.collection("centers").doc(centerId).collection("assignments").doc(editing.id).set({
        teacherUid, day: editing.day, s: cs, e: ce, className: className.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      setEditing(null);
    } catch (err) {
      notify("Lưu thất bại, thử lại nhé.", "error");
    }
  };

  const handleDelete = async () => {
    await db.collection("centers").doc(centerId).collection("assignments").doc(editing.id).delete().catch(() => {});
    setEditing(null);
  };

  const handleCancel = async () => {
    if (editing.isDraft) {
      await db.collection("centers").doc(centerId).collection("assignments").doc(editing.id).delete().catch(() => {});
    }
    setEditing(null);
  };

  return (
    <div className="mt-3 rounded-xl border p-3" style={{ borderColor: BORDER, backgroundColor: "#FFFCF7" }}>
      <p className="mb-2 text-xs font-medium" style={{ color: INK }}>{editing.isDraft ? "Xếp lớp mới" : "Sửa lớp đã xếp"} — {DAYS[editing.day].full}</p>
      <div className="mb-2 grid grid-cols-2 gap-2">
        <div>
          <label className="mb-1 block text-[11px]" style={{ color: MUTED }}>Bắt đầu</label>
          <input type="time" step="300" value={sVal} onChange={(e) => setSVal(e.target.value)} className="w-full rounded-lg border px-2 py-1.5 text-sm" style={{ borderColor: BORDER, color: INK }} />
        </div>
        <div>
          <label className="mb-1 block text-[11px]" style={{ color: MUTED }}>Kết thúc</label>
          <input type="time" step="300" value={eVal} onChange={(e) => setEVal(e.target.value)} className="w-full rounded-lg border px-2 py-1.5 text-sm" style={{ borderColor: BORDER, color: INK }} />
        </div>
      </div>
      <div className="mb-3">
        <label className="mb-1 block text-[11px]" style={{ color: MUTED }}>Tên lớp / ghi chú</label>
        <input type="text" value={className} onChange={(e) => setClassName(e.target.value)} placeholder="VD: HSK3 — Lớp tối thứ 4" className="w-full rounded-lg border px-2 py-1.5 text-sm" style={{ borderColor: BORDER, color: INK }} />
      </div>
      <div className="flex gap-2">
        <button onClick={handleSave} className="rounded-full px-3 py-1.5 text-xs font-semibold text-white" style={{ backgroundColor: "#FFA94D" }}>Lưu</button>
        <button onClick={handleDelete} className="rounded-full border px-3 py-1.5 text-xs font-medium hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: DANGER }}>Xoá</button>
        <button onClick={handleCancel} className="rounded-full border px-3 py-1.5 text-xs font-medium hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: "#8A6070" }}>Huỷ</button>
      </div>
    </div>
  );
}

function TeacherCard({ centerId, teacher, assignmentsForTeacher, notify }) {
  const [editingA, setEditingA] = useState(null);
  const freeMin = totalFreeMinutes(teacher.busySlots || {});
  const assignedMin = totalAssignedMinutes(assignmentsForTeacher || {});

  const handleCreateDraft = useCallback((day, s, e) => {
    const [cs, ce] = clampRange(s, e);
    if (ce <= cs) return;
    if (!isRangeFreeOfBusy(teacher.busySlots || {}, day, cs, ce)) {
      notify("Khung giờ này trùng với giờ bận cá nhân của giáo viên.", "error");
      return;
    }
    if (!isRangeFreeOfBusy(assignmentsForTeacher || {}, day, cs, ce)) {
      notify("Khung giờ này trùng với 1 lớp khác đã xếp cho giáo viên.", "error");
      return;
    }
    const newId = uid();
    db.collection("centers").doc(centerId).collection("assignments").doc(newId).set({
      teacherUid: teacher.uid, day, s: cs, e: ce, className: "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).catch(() => notify("Không xếp được lớp, thử lại nhé.", "error"));
    setEditingA({ day, id: newId, s: cs, e: ce, className: "", isDraft: true });
  }, [teacher, assignmentsForTeacher, centerId, notify]);

  const handleSelectAssignment = useCallback((day, block) => {
    setEditingA({ day, id: block.id, s: block.s, e: block.e, className: block.className || "" });
  }, []);

  return (
    <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
      <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
        <div>
          <p className="text-sm font-semibold" style={{ color: INK, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>{teacher.email || "Giáo viên"}</p>
          <p className="text-xs" style={{ color: MUTED }}>{formatDuration(freeMin)} rảnh/tuần · {formatDuration(assignedMin)} đã xếp lớp</p>
        </div>
      </div>
      <AssignmentGrid busySlots={teacher.busySlots || {}} assignments={assignmentsForTeacher || {}} onCreateDraft={handleCreateDraft} onSelectAssignment={handleSelectAssignment} />
      {editingA && (
        <AssignmentEditForm
          editing={editingA}
          setEditing={setEditingA}
          centerId={centerId}
          teacherUid={teacher.uid}
          busySlots={teacher.busySlots || {}}
          assignments={assignmentsForTeacher || {}}
          notify={notify}
        />
      )}
      <p className="mt-2 text-[11px]" style={{ color: MUTED_LIGHT }}>Kéo chuột trên lịch để xếp lớp vào khung giờ trống · bấm vào 1 lớp đã xếp để sửa/xoá.</p>
    </div>
  );
}

function InviteForm({ centerId, centerName, notify }) {
  const [email, setEmail] = useState("");
  const [busy, setBusy] = useState(false);

  const handleInvite = async () => {
    const normalized = email.trim().toLowerCase();
    if (!normalized || !normalized.includes("@")) { notify("Nhập email hợp lệ của giáo viên.", "error"); return; }
    setBusy(true);
    try {
      await db.collection("centers").doc(centerId).collection("invites").add({
        email: normalized, centerName: centerName || "", status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setEmail("");
      notify("Đã gửi lời mời — giáo viên sẽ thấy khi họ đăng nhập vào TNTime.", "success");
    } catch (err) {
      notify("Không gửi được lời mời, thử lại nhé.", "error");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="flex flex-wrap gap-2">
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleInvite(); }} placeholder="email-giao-vien@gmail.com" className="flex-1 min-w-[200px] rounded-full border px-3 py-2 text-sm" style={{ borderColor: BORDER, color: INK }} />

    </div>
  );

function CenterOwnerDashboard({ ownedCenterId, notify }) {
  const [center, setCenter] = useState(null);
  const [members, setMembers] = useState([]);
  const [assignmentsByTeacher, setAssignmentsByTeacher] = useState({});
  const [invites, setInvites] = useState([]);

  useEffect(() => {
    const unsub1 = db.collection("centers").doc(ownedCenterId).onSnapshot((snap) => setCenter(snap.exists ? { id: snap.id, ...snap.data() } : null));
    const unsub2 = db.collection("centers").doc(ownedCenterId).collection("members").onSnapshot((snap) => {
      setMembers(snap.docs.map((d) => ({ uid: d.id, ...d.data() })).filter((m) => m.role !== "owner"));
    }, () => {});
    const unsub3 = db.collection("centers").doc(ownedCenterId).collection("assignments").onSnapshot((snap) => {
      const byTeacher = {};
      snap.docs.forEach((d) => {
        const a = { id: d.id, ...d.data() };
        byTeacher[a.teacherUid] = byTeacher[a.teacherUid] || {};
        byTeacher[a.teacherUid][a.day] = byTeacher[a.teacherUid][a.day] || [];
        byTeacher[a.teacherUid][a.day].push(a);
      });
      setAssignmentsByTeacher(byTeacher);
    }, () => {});
    const unsub4 = db.collection("centers").doc(ownedCenterId).collection("invites").onSnapshot((snap) => {
      setInvites(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    }, () => {});
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
  }, [ownedCenterId]);

  return (
    <div className="space-y-4">
      <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <div className="mb-3">
          <p className="text-sm font-medium" style={{ color: INK }}>{center?.name || "Trung tâm của bạn"}</p>
          <p className="text-xs" style={{ color: MUTED }}>{members.length} giáo viên đã tham gia</p>
        </div>
        <InviteForm centerId={ownedCenterId} centerName={center?.name} notify={notify} />
        <div className="mt-2"><OwnerInvitesList centerId={ownedCenterId} invites={invites} /></div>
      </div>

      {members.length === 0 && (
        <p className="rounded-2xl border p-4 text-center text-xs" style={{ borderColor: BORDER, color: MUTED, backgroundColor: CARD }}>
          Chưa có giáo viên nào tham gia. Mời bằng email ở trên — giáo viên sẽ thấy lời mời khi họ đăng nhập vào TNTime.
        </p>
      )}

      {members.map((m) => (
        <TeacherCard key={m.uid} centerId={ownedCenterId} teacher={m} assignmentsForTeacher={assignmentsByTeacher[m.uid] || {}} notify={notify} />
      ))}
    </div>
  );
}

  const [assignments, setAssignments] = useState({});

  useEffect(() => {
    const unsub1 = db.collection("centers").doc(centerId).onSnapshot((snap) => setCenter(snap.exists ? { id: snap.id, ...snap.data() } : null));
    const unsub2 = db.collection("centers").doc(centerId).collection("assignments").where("teacherUid", "==", user.uid).onSnapshot((snap) => {
      const byDay = {};
      snap.docs.forEach((d) => {
        const a = { id: d.id, ...d.data() };
        byDay[a.day] = byDay[a.day] || [];
        byDay[a.day].push(a);
      });
      Object.keys(byDay).forEach((d) => byDay[d].sort((x, y) => x.s - y.s));
      setAssignments(byDay);
    }, () => {});
    return () => { unsub1(); unsub2(); };
  }, [centerId, user.uid]);

  const dayIdxWithClasses = DAYS.map((_d, di) => di).filter((di) => (assignments[di] || []).length);

  return (
    <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
      <p className="mb-2 text-sm font-semibold" style={{ color: INK, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>{center?.name || "Trung tâm"}</p>
      {dayIdxWithClasses.length === 0 ? (
        <p className="text-xs" style={{ color: MUTED }}>Chưa có lớp nào được xếp cho bạn ở trung tâm này.</p>
      ) : (
        <div className="space-y-1.5">
          {dayIdxWithClasses.map((di) => (
            <div key={di} className="flex flex-wrap items-center gap-2 text-xs">
              <span className="w-9 shrink-0 font-semibold" style={{ color: PRIMARY }}>{DAYS[di].short}</span>
              {(assignments[di] || []).map((a) => (
                <span key={a.id} className="rounded-full border px-2.5 py-1" style={{ borderColor: "#FFA94D", backgroundColor: "#FFF6E9", color: "#8A5A12" }}>
                  {minToHHMM(a.s)}–{minToHHMM(a.e)}{a.className ? ` · ${a.className}` : ""}
                </span>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CenterView({ user, centerIds, setCenterIds, ownedCenterId, setOwnedCenterId, notify }) {
  const pendingInvites = usePendingInvites(user.email);

  const handleAccept = async (invite) => {
    try {
      await db.collection("centers").doc(invite.centerId).collection("members").doc(user.uid).set({
        email: user.email || null, role: "teacher", status: "active",
        joinedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      await db.collection("users").doc(user.uid).set({ centerIds: firebase.firestore.FieldValue.arrayUnion(invite.centerId) }, { merge: true });
      await db.collection("centers").doc(invite.centerId).collection("invites").doc(invite.id).delete().catch(() => {});
      setCenterIds((prev) => (prev.includes(invite.centerId) ? prev : [...prev, invite.centerId]));
      notify(`Đã tham gia trung tâm "${invite.centerName || ""}".`, "success");
    } catch (err) {
      notify("Không tham gia được, thử lại nhé.", "error");
    }
  };

  const handleDecline = async (invite) => {
    await db.collection("centers").doc(invite.centerId).collection("invites").doc(invite.id).delete().catch(() => {});
  };

  return (
    <div className="space-y-4">
      {pendingInvites.length > 0 && (
        <div className="space-y-2">
          {pendingInvites.map((inv) => (
            <PendingInviteCard key={inv.centerId + inv.id} invite={inv} onAccept={handleAccept} onDecline={handleDecline} />
          ))}
        </div>
      )}

      {ownedCenterId && <CenterOwnerDashboard ownedCenterId={ownedCenterId} notify={notify} />}

      {centerIds.length > 0 && (
        <div className="space-y-3">
          {centerIds.map((cid) => <TeacherCenterCard key={cid} centerId={cid} user={user} />)}
        </div>
      )}

      {!ownedCenterId && <CreateCenterCard user={user} setOwnedCenterId={setOwnedCenterId} notify={notify} />}
    </div>
  );
}

function AuthScreen({ notify }) {
  const [mode, setMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const switchMode = (m) => { setMode(m); setError(""); };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email.trim() || !password) { setError("Vui lòng nhập đầy đủ email và mật khẩu."); return; }
    setBusy(true);
    try {
      if (mode === "signin") {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      } else {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally {
      setBusy(false);
    }
  };

  const handleGoogle = async () => {
    setError("");
    setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      // Luôn hiện màn hình chọn tài khoản Google, để tránh đăng nhập nhầm
      // sang một tài khoản Gmail khác (gây cảm giác "mất dữ liệu" vì mỗi
      // tài khoản Google có kho lịch riêng trên máy chủ).
      provider.setCustomParameters({ prompt: "select_account" });
      await auth.signInWithPopup(provider);
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally {
      setBusy(false);
    }
  };

  const handleForgot = async () => {
    setError("");
    if (!email.trim()) { setError("Nhập email của bạn vào ô bên trên trước, rồi bấm lại \"Quên mật khẩu?\"."); return; }
    try {
      await auth.sendPasswordResetEmail(email.trim());
      notify("Đã gửi email đặt lại mật khẩu, hãy kiểm tra hộp thư.", "success");
    } catch (err) {
      setError(mapAuthError(err.code));
    }
  };

  return (
    <AuthBackdrop>
      <div className="relative z-10 w-full max-w-sm rounded-3xl border p-6 shadow-sm" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <div className="mb-5 flex flex-col items-center gap-1 text-center">
          <Flower size={34} petal={PRIMARY} center={SECONDARY} />
          <h1 className="text-2xl font-extrabold" style={{ fontFamily: "'Baloo 2', system-ui, sans-serif", color: PRIMARY, letterSpacing: "0.5px" }}>TNTime</h1>
          <p className="text-xs" style={{ color: MUTED }}>{mode === "signin" ? "Đăng nhập để tiếp tục" : "Tạo tài khoản mới"}</p>
        </div>

        <div className="mb-4 flex gap-1 rounded-full border p-1" style={{ borderColor: BORDER }}>
          <button type="button" onClick={() => switchMode("signin")} className="flex-1 rounded-full py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: mode === "signin" ? PRIMARY : "transparent", color: mode === "signin" ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>Đăng nhập</button>
          <button type="button" onClick={() => switchMode("signup")} className="flex-1 rounded-full py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: mode === "signup" ? PRIMARY : "transparent", color: mode === "signup" ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>Đăng ký</button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-3">
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Email</label>
            <input type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: BORDER, color: INK }} placeholder="ban@gmail.com" />
          </div>
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Mật khẩu</label>
            <input type="password" autoComplete={mode === "signin" ? "current-password" : "new-password"} value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleSubmit(e); }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: BORDER, color: INK }} placeholder="Tối thiểu 6 ký tự" />
          </div>
          {error && (
            <p className="flex items-center gap-1.5 text-xs" style={{ color: DANGER }}><AlertTriangle size={13} />{error}</p>
          )}
          <button type="submit" disabled={busy} className="flex w-full items-center justify-center gap-1.5 rounded-full py-2 text-sm font-semibold text-white disabled:opacity-60" style={{ backgroundColor: PRIMARY, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
            {busy ? "Đang xử lý..." : mode === "signin" ? "Đăng nhập" : "Tạo tài khoản"}
          </button>
        </form>

        {mode === "signin" && (
          <button type="button" onClick={handleForgot} className="mt-2 w-full text-center text-[11px] hover:underline" style={{ color: MUTED }}>Quên mật khẩu?</button>
        )}

        <div className="my-4 flex items-center gap-2">
          <div className="h-px flex-1" style={{ backgroundColor: BORDER }} />
          <span className="text-[11px]" style={{ color: MUTED_LIGHT }}>hoặc</span>
          <div className="h-px flex-1" style={{ backgroundColor: BORDER }} />
        </div>

        <button type="button" onClick={handleGoogle} disabled={busy} className="flex w-full items-center justify-center gap-2 rounded-full border py-2 text-sm font-medium disabled:opacity-60" style={{ borderColor: BORDER, color: INK, backgroundColor: "#FFFFFF" }}>
          <GoogleGlyph /> Đăng nhập bằng Google
        </button>
      </div>
    </AuthBackdrop>
  );
}

/* ---------------------------------------------------------------------- */

const TABS = [
  { id: "dashboard", label: "Tổng quan", icon: LayoutGrid },
  { id: "slots", label: "Khung giờ bận", icon: Clock3 },
  { id: "center", label: "Trung tâm", icon: Users2 },
  { id: "assistant", label: "Trợ lý sắp xếp", icon: Sparkles },
];

function App() {
  const [user, setUser] = useState(undefined); // undefined = đang kiểm tra, null = chưa đăng nhập
  const [view, setView] = useState("dashboard");
  const [busySlots, setBusySlots] = useState({});
  const [tasks, setTasks] = useState([]);
  const [tags, setTags] = useState(DEFAULT_TAGS);
  // Khung giờ bận chỉ diễn ra 1 lần: { "YYYY-MM-DD": [{ id, s, e, note, tag }] }
  const [busyOnce, setBusyOnce] = useState({});
  // Trung tâm: centerIds = các trung tâm mình tham gia với vai trò giáo viên;
  // ownedCenterId = trung tâm mình làm chủ (nếu có).
  const [centerIds, setCenterIds] = useState([]);
  const [ownedCenterId, setOwnedCenterId] = useState(null);
  const [dataLoading, setDataLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const skipNextSave = useRef(false);
  const saveTimer = useRef(null);

  const notify = useCallback((message, type = "success") => setToast({ message, type, id: uid() }), []);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);

  /* Theo dõi trạng thái đăng nhập */
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  /* Khi có người dùng đăng nhập: tải dữ liệu của họ từ Firestore.
     Nếu là lần đầu (chưa có tài liệu trên Firestore), dùng tạm dữ liệu
     localStorage cũ trên trình duyệt này (nếu có) làm dữ liệu khởi đầu,
     để không mất dữ liệu đã nhập trước khi có tính năng đăng nhập. */
  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    setDataLoading(true);
    const ref = db.collection("users").doc(user.uid);
    ref.get().then((snap) => {
      if (cancelled) return;
      if (snap.exists) {
        const data = snap.data() || {};
        setCenterIds(Array.isArray(data.centerIds) ? data.centerIds : []);
        setTags(normalizeTags(data.tags));
        setBusyOnce(normalizeLoadedBusySlots(data.busyOnce));
        // Việc kiểu cũ (hạn theo "thứ") → chuyển sang ngày thật, lưu lại ngay
        const rawTasks = Array.isArray(data.tasks) ? data.tasks : [];
        const loadedTasks = rawTasks.map(migrateTask).filter(Boolean);
        if (rawTasks.some((t) => t && t.v !== 2)) ref.set({ tasks: loadedTasks }, { merge: true }).catch(() => {});
        setOwnedCenterId(data.ownedCenterId || null);
        if (data.busySlots) {
          const loadedBusy = normalizeLoadedBusySlots(data.busySlots);
          skipNextSave.current = true;
          setBusySlots(loadedBusy);
          setTasks(loadedTasks);
        } else {
          // Dữ liệu cũ chỉ có "freeSlots" (khung giờ rảnh) — chuyển sang mô
          // hình "khung giờ bận" mới bằng phần bù, rồi lưu lại luôn.
          const oldFree = normalizeLoadedFreeIntervals(data.freeSlots || {});
          const migratedBusy = migrateFreeToBusySlots(oldFree);
          skipNextSave.current = true;
          setBusySlots(migratedBusy);
          setTasks(loadedTasks);
          ref.set({ busySlots: migratedBusy }, { merge: true }).catch(() => {});
        }
      } else {
        const rawInitFree = loadLS(LS_FREE, null);
        const initBusy = rawInitFree ? migrateFreeToBusySlots(normalizeLoadedFreeIntervals(rawInitFree)) : {};
        const initTasks = (loadLS(LS_TASKS, null) || []).map(migrateTask).filter(Boolean);
        skipNextSave.current = true;
        setBusySlots(initBusy);
        setTasks(initTasks);
        ref.set({
          busySlots: initBusy,
          tasks: initTasks,
          email: user.email || null,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }).catch(() => {});
        // Tài khoản này chưa từng có dữ liệu trên máy chủ. Nếu người dùng
        // nghĩ mình đã từng nhập lịch trước đó, rất có thể họ vừa đăng nhập
        // nhầm sang một tài khoản Google khác (nhiều Gmail trên cùng máy).
        if (!rawInitFree && initTasks.length === 0) {
          notify(`Tài khoản ${user.email || ""} chưa có dữ liệu nào. Nếu bạn từng nhập lịch trước đó, hãy đăng xuất và đăng nhập lại đúng tài khoản Google bạn đã dùng lần đầu.`, "error");
        }
      }
      setDataLoading(false);
    }).catch(() => {
      if (cancelled) return;
      notify("Không tải được dữ liệu từ máy chủ, hãy thử tải lại trang.", "error");
      setDataLoading(false);
    });
    return () => { cancelled = true; };
  }, [user]);

  /* Lưu lên Firestore mỗi khi dữ liệu thay đổi (gộp các thay đổi liên tiếp
     trong ~600ms để tránh ghi quá nhiều lần). */
  useEffect(() => {
    if (!user || dataLoading) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      db.collection("users").doc(user.uid).set({
        busySlots, busyOnce, tasks,
        tags: tags.map(({ id, label, color }) => ({ id, label: label.trim() || "Tag", color })),
        email: user.email || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true }).then(() => {
        setJustSaved(true);
        setTimeout(() => setJustSaved(false), 900);
      }).catch(() => notify("Lưu dữ liệu thất bại, kiểm tra kết nối mạng.", "error"));
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [busySlots, busyOnce, tasks, tags, user, dataLoading]);

  /* Đồng bộ khung giờ bận cá nhân vào từng trung tâm mình đang tham gia (với
     vai trò giáo viên), để chủ trung tâm xem được lịch rảnh khi xếp lớp.
     Không đụng gì tới users/{uid} — chỉ ghi thêm vào centers/{id}/members/{uid}. */
  useEffect(() => {
    if (!user || dataLoading || centerIds.length === 0) return;
    const t = setTimeout(() => {
      centerIds.forEach((cid) => {
        db.collection("centers").doc(cid).collection("members").doc(user.uid).set({
          busySlots, email: user.email || null, role: "teacher", status: "active",
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true }).catch(() => {});
      });
    }, 600);
    return () => clearTimeout(t);
  }, [busySlots, centerIds, user, dataLoading]);

  const handleLogout = async () => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    await auth.signOut();
    setCenterIds([]);
    setOwnedCenterId(null);
    setBusySlots({});
    setTasks([]);
    setTags(DEFAULT_TAGS);
    setBusyOnce({});
    setDataLoading(true);
  };

  const handleDropTask = (taskId, dk, startMin) => {
    if (!taskId) return;
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    const err = placementError(busySlots, busyOnce, tasks, task, dk, startMin);
    if (err) { notify("Không thể đặt vào đây — " + err, "error"); return; }
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, status: "scheduled", scheduledDate: dk, scheduledStart: startMin } : t)));
    notify(`Đã chuyển "${task.name}" sang ${fmtDateLabel(dk)} ${minToHHMM(startMin)}.`, "success");
  };

  const resetAllData = () => {
    const emailHint = user?.email ? ` của tài khoản ${user.email}` : "";
    if (!window.confirm(`XOÁ VĨNH VIỄN toàn bộ dữ liệu đã lưu${emailHint} (khung giờ bận + việc cần làm)?\n\nHành động này KHÔNG THỂ hoàn tác. Bấm OK chỉ khi bạn chắc chắn muốn xoá sạch.`)) return;
    setBusySlots({});
    setBusyOnce({});
    setTasks([]);
    notify("Đã xoá toàn bộ dữ liệu.", "success");
  };

  if (user === undefined) return <LoadingScreen label="Đang kiểm tra đăng nhập..." />;
  if (user === null) return <AuthScreen notify={notify} />;
  if (dataLoading) return <LoadingScreen label="Đang tải dữ liệu của bạn..." />;

  return (
    <div className="relative min-h-screen w-full" style={{ backgroundColor: "#FFF6FA", fontFamily: "'Inter', system-ui, sans-serif" }}>
      {/* soft decorative background blobs */}
      <div className="bg-blob" style={{ width: 320, height: 320, top: -120, left: -100, background: "radial-gradient(circle, #FDE3EE 0%, rgba(253,227,238,0) 70%)" }} />
      <div className="bg-blob" style={{ width: 280, height: 280, bottom: -100, right: -80, background: "radial-gradient(circle, #FFF1D6 0%, rgba(255,241,214,0) 70%)" }} />
      <div className="bg-blob" style={{ width: 220, height: 220, top: "40%", right: -110, background: "radial-gradient(circle, #EFE6FA 0%, rgba(239,230,250,0) 70%)" }} />

      <header className="relative overflow-hidden border-b" style={{ borderColor: BORDER, background: "linear-gradient(180deg, #FDEDF4 0%, #FFF6FA 100%)" }}>
        <Cloud size={110} color="#FFFFFF" opacity={0.9} className="float-slow" style={{ position: "absolute", top: 10, left: 18 }} />
        <Cloud size={70} color="#FFFFFF" opacity={0.8} className="float-slower" style={{ position: "absolute", top: 30, left: 130 }} />
        <Rainbow size={130} opacity={0.85} style={{ position: "absolute", top: -10, right: 24 }} />

        <div className="relative z-10 mx-auto flex max-w-5xl flex-col gap-4 px-5 py-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 className="text-3xl font-extrabold" style={{ fontFamily: "'Baloo 2', system-ui, sans-serif", color: PRIMARY, letterSpacing: "0.5px" }}>TNTime</h1>
            <p className="flex flex-wrap items-center gap-1.5 text-xs" style={{ color: "#9C6B80" }}>
              Tự động tối ưu thời gian trống trong tuần
              <span className="flex items-center gap-1" style={{ color: justSaved ? PRIMARY : "#E3B9CB", transition: "color .3s" }}>
                <Save size={11} /> {justSaved ? "đã lưu" : "tự động lưu"}
              </span>
              {user?.email && <span style={{ color: MUTED_LIGHT }}>· {user.email}</span>}
            </p>
          </div>
          <div className="flex items-center gap-2">
            <nav className="flex gap-1 rounded-full border p-1" style={{ borderColor: BORDER, backgroundColor: "#FFFFFF" }}>
              {TABS.map((t) => {
                const active = view === t.id;
                const Icon = t.icon;
                return (
                  <button key={t.id} onClick={() => setView(t.id)} className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: active ? PRIMARY : "transparent", color: active ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
                    <Icon size={14} />{t.label}
                  </button>
                );
              })}
            </nav>
            <button onClick={resetAllData} title="Xoá toàn bộ dữ liệu đã lưu (không thể hoàn tác)" className="flex items-center gap-1.5 rounded-full border px-3 py-2 text-xs font-medium hover:bg-[#FFF1F1]" style={{ borderColor: "#F5C6C6", color: DANGER, backgroundColor: "#FFFFFF" }}>
              <RotateCcw size={14} /> Xoá dữ liệu
            </button>
            <span style={{ width: 10 }} />
            <button onClick={handleLogout} title="Đăng xuất" className="flex items-center gap-1.5 rounded-full border px-3 py-2 text-xs font-medium hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: "#8A6070", backgroundColor: "#FFFFFF" }}>
              <XIcon size={14} /> Đăng xuất
            </button>
          </div>
        </div>
        <FlowerDivider />
      </header>

      <TagsContext.Provider value={tags}>
      <main className="relative z-10 mx-auto max-w-5xl px-5 py-6">
        {view === "dashboard" && <DashboardView busySlots={busySlots} busyOnce={busyOnce} tasks={tasks} onDropTask={handleDropTask} />}
        {view === "slots" && <SlotEditorView busySlots={busySlots} setBusySlots={setBusySlots} busyOnce={busyOnce} setBusyOnce={setBusyOnce} tasks={tasks} setTags={setTags} notify={notify} />}
        {view === "center" && (
          <CenterView
            user={user}
            centerIds={centerIds}
            setCenterIds={setCenterIds}
            ownedCenterId={ownedCenterId}
            setOwnedCenterId={setOwnedCenterId}
            notify={notify}
          />
        )}
        {view === "assistant" && <AssistantView tasks={tasks} setTasks={setTasks} busySlots={busySlots} busyOnce={busyOnce} notify={notify} />}
      </main>
      </TagsContext.Provider>

      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
