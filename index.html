/* ---------------------------------------------------------------------- */
/*  Constants & design tokens                                             */
/* ---------------------------------------------------------------------- */

const DAYS = [
  { short: "T2", full: "Thứ 2" },
  { short: "T3", full: "Thứ 3" },
  { short: "T4", full: "Thứ 4" },
  { short: "T5", full: "Thứ 5" },
  { short: "T6", full: "Thứ 6" },
  { short: "T7", full: "Thứ 7" },
  { short: "CN", full: "Chủ nhật" },
];

const HOUR_START = 6;
const HOUR_END = 22;
const HOURS = Array.from({ length: HOUR_END - HOUR_START + 1 }, (_, i) => HOUR_START + i);

/* Khung thời gian trong ngày tính theo phút (dùng cho khung giờ rảnh chính
   xác tới từng phút). Ngày bắt đầu 6:00, kết thúc 23:00. */
const DAY_START_MIN = HOUR_START * 60; // 360  = 6:00
const DAY_END_MIN = (HOUR_END + 1) * 60; // 1380 = 23:00
const TIME_STEP_MIN = 5;

const CATEGORIES = [
  { id: "hoc", label: "Học trên lớp", bg: "#FDEAF2", border: "#F2699B", text: "#B23D6F" },
  { id: "btvn", label: "Bài tập", bg: "#FFF6DE", border: "#FFC94D", text: "#9C7A12" },
  { id: "on", label: "Ôn thi", bg: "#F3EDFB", border: "#B79CE0", text: "#6B4FA0" },
  { id: "clb", label: "CLB / Ngoại khoá", bg: "#FFEEE0", border: "#FFA94D", text: "#B15C0E" },
  { id: "khac", label: "Việc khác", bg: "#EAF7E8", border: "#7CC576", text: "#3E7A38" },
];
const catOf = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[CATEGORIES.length - 1];

const key = (day, hour) => `${day}-${hour}`;
const uid = () => Math.random().toString(36).slice(2, 10);

/* palette tokens */
const INK = "#4A2E3E";
const MUTED = "#B98CA0";
const MUTED_LIGHT = "#D9B9C8";
const BORDER = "#F6D6E4";
const CARD = "#FFFFFF";
const PRIMARY = "#F2699B";
const SECONDARY = "#FFC94D";
const PURPLE = "#B79CE0";
const DANGER = "#E0637E";

/* ---------------------------------------------------------------------- */
/*  localStorage persistence                                              */
/* ---------------------------------------------------------------------- */

const LS_FREE = "tntime_free_slots_v1";
const LS_TASKS = "tntime_tasks_v1";

function loadLS(k, fallback) {
  try {
    const raw = localStorage.getItem(k);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

/* ---------------------------------------------------------------------- */
/*  Khung giờ bận — lưu theo từng khối có ghi chú (chính xác tới 5 phút)   */
/*  Cấu trúc: busySlots = { [ngày]: [{ id, s, e, note }, ...] }            */
/*  Bất kỳ khung giờ nào KHÔNG được đánh dấu bận thì mặc định là RẢNH.     */
/* ---------------------------------------------------------------------- */

function clampRange(a, b) {
  const s = Math.max(DAY_START_MIN, Math.min(a, b));
  const e = Math.min(DAY_END_MIN, Math.max(a, b));
  return [s, e];
}

function normalizeIntervals(list) {
  const sorted = (list || [])
    .map((item) => (Array.isArray(item) ? [Number(item[0]), Number(item[1])] : [Number(item.s), Number(item.e)]))
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [s, e] of sorted) {
    if (out.length && s <= out[out.length - 1][1]) {
      out[out.length - 1][1] = Math.max(out[out.length - 1][1], e);
    } else {
      out.push([s, e]);
    }
  }
  return out;
}

/* Phần còn trống sau khi trừ đi các khoảng đã cho, trong giới hạn [dayStart, dayEnd]. */
function complementIntervals(list, dayStart, dayEnd) {
  const merged = normalizeIntervals(list);
  const out = [];
  let cursor = dayStart;
  merged.forEach(([s, e]) => {
    if (s > cursor) out.push([cursor, Math.min(s, dayEnd)]);
    cursor = Math.max(cursor, e);
  });
  if (cursor < dayEnd) out.push([cursor, dayEnd]);
  return out.filter(([s, e]) => e > s);
}

function addBusyBlock(busySlots, day, start, end, note) {
  const [s, e] = clampRange(start, end);
  if (e <= s) return busySlots;
  const dayList = busySlots[day] || [];
  const block = { id: uid(), s, e, note: (note || "").trim() };
  return { ...busySlots, [day]: [...dayList, block] };
}

function updateBusyBlock(busySlots, day, id, patch) {
  const dayList = busySlots[day] || [];
  return { ...busySlots, [day]: dayList.map((b) => (b.id === id ? { ...b, ...patch } : b)) };
}

function removeBusyBlock(busySlots, day, id) {
  const dayList = busySlots[day] || [];
  return { ...busySlots, [day]: dayList.filter((b) => b.id !== id) };
}

function isRangeFreeOfBusy(busySlots, day, start, end, excludeId) {
  const dayList = busySlots[day] || [];
  return !dayList.some((b) => b.id !== excludeId && b.s < end && b.e > start);
}

function busySegmentsInRange(busySlots, day, start, end) {
  const dayList = busySlots[day] || [];
  const segs = [];
  dayList.forEach((b) => {
    const os = Math.max(b.s, start), oe = Math.min(b.e, end);
    if (oe > os) segs.push({ ...b, os, oe });
  });
  return segs;
}

function dayBusyUnion(busySlots, day) {
  return normalizeIntervals(busySlots[day] || []);
}

function busyMinutesForDay(busySlots, day) {
  return dayBusyUnion(busySlots, day).reduce((s, [a, b]) => s + (b - a), 0);
}

function totalBusyMinutes(busySlots) {
  return Object.keys(busySlots || {}).reduce((s, d) => s + busyMinutesForDay(busySlots, d), 0);
}

const DAY_TOTAL_MIN = DAY_END_MIN - DAY_START_MIN;

function freeMinutesForDay(busySlots, day) {
  return Math.max(0, DAY_TOTAL_MIN - busyMinutesForDay(busySlots, day));
}

function totalFreeMinutes(busySlots) {
  return DAYS.reduce((s, _d, di) => s + freeMinutesForDay(busySlots, di), 0);
}

function formatDuration(min) {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  if (!h) return `${m}p`;
  return m ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`;
}

function minToHHMM(min) {
  const m = Math.max(0, Math.round(min));
  const h = Math.floor(m / 60), mm = m % 60;
  return `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

function hhmmToMin(str) {
  const [h, m] = String(str || "0:0").split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}

function roundToStep(min) {
  return Math.round(min / TIME_STEP_MIN) * TIME_STEP_MIN;
}

/* Chuyển dữ liệu "khung giờ rảnh" định dạng cũ nhất (mỗi ô 1 giờ, dạng
   { "ngày-giờ": true }) sang khoảng phút — bước trung gian trước khi suy ra
   khung giờ bận mới. */
function migrateOldFreeSlots(old) {
  const byDay = {};
  Object.keys(old).forEach((k) => {
    if (old[k] !== true) return;
    const parts = k.split("-");
    const day = Number(parts[0]), hour = Number(parts[1]);
    if (Number.isNaN(day) || Number.isNaN(hour)) return;
    byDay[day] = byDay[day] || [];
    byDay[day].push([hour * 60, hour * 60 + 60]);
  });
  const result = {};
  Object.keys(byDay).forEach((d) => { result[d] = normalizeIntervals(byDay[d]); });
  return result;
}

function normalizeLoadedFreeIntervals(raw) {
  if (!raw || typeof raw !== "object") return {};
  const looksOld = Object.keys(raw).some((k) => k.includes("-"));
  if (looksOld) return migrateOldFreeSlots(raw);
  const out = {};
  Object.keys(raw).forEach((d) => { out[d] = normalizeIntervals(raw[d] || []); });
  return out;
}

/* Dữ liệu cũ lưu "khung giờ RẢNH" — chuyển sang mô hình "khung giờ BẬN" mới
   bằng cách lấy phần bù (không rảnh = bận) cho những ngày TRƯỚC ĐÂY đã có
   đánh dấu rảnh cụ thể. Ngày nào chưa từng đánh dấu gì trong dữ liệu cũ (kể
   cả trường hợp đã bấm "Xoá tất cả" nên rỗng) thì coi là chưa có thông tin
   và mặc định là RẢNH ở mô hình mới, thay vì suy ra cả ngày bận. */
function migrateFreeToBusySlots(freeIntervalsByDay) {
  const result = {};
  DAYS.forEach((_d, di) => {
    const hasOldData = Object.prototype.hasOwnProperty.call(freeIntervalsByDay || {}, di) || Object.prototype.hasOwnProperty.call(freeIntervalsByDay || {}, String(di));
    if (!hasOldData) { result[di] = []; return; }
    const freeList = freeIntervalsByDay[di] || [];
    const busyRanges = complementIntervals(freeList, DAY_START_MIN, DAY_END_MIN);
    result[di] = busyRanges.map(([s, e]) => ({ id: uid(), s, e, note: "" }));
  });
  return result;
}

/* Chuẩn hoá dữ liệu busySlots đọc từ Firestore: đảm bảo mỗi khối có đủ
   id/s/e/note hợp lệ, bỏ khối rỗng hoặc sai lệch. */
function normalizeLoadedBusySlots(raw) {
  if (!raw || typeof raw !== "object") return {};
  const out = {};
  Object.keys(raw).forEach((d) => {
    out[d] = (raw[d] || [])
      .map((b) => ({ id: b.id || uid(), s: Number(b.s), e: Number(b.e), note: typeof b.note === "string" ? b.note : "" }))
      .filter((b) => b.e > b.s);
  });
  return out;
}

/* ---------------------------------------------------------------------- */
/*  Scheduling helpers                                                    */
/* ---------------------------------------------------------------------- */

function canPlace(busySlots, occupied, day, start, duration, excludeId) {
  if (start + duration > HOUR_END + 1) return false;
  if (!isRangeFreeOfBusy(busySlots, day, start * 60, (start + duration) * 60)) return false;
  for (let i = 0; i < duration; i++) {
    const k = key(day, start + i);
    if (occupied[k] && occupied[k] !== excludeId) return false;
  }
  return true;
}

function buildOccupied(tasks, excludeId) {
  const occ = {};
  tasks.forEach((t) => {
    if (t.status === "scheduled" && t.id !== excludeId) {
      for (let i = 0; i < t.duration; i++) occ[key(t.scheduledDay, t.scheduledStart + i)] = t.id;
    }
  });
  return occ;
}

function autoSchedule(tasks, busySlots) {
  const occupied = buildOccupied(tasks, null);
  const pending = tasks
    .filter((t) => t.status !== "scheduled")
    .slice()
    .sort((a, b) => {
      const da = a.deadlineDay * 100 + a.deadlineHour;
      const db = b.deadlineDay * 100 + b.deadlineHour;
      if (da !== db) return da - db;
      return b.duration - a.duration;
    });

  const results = {};
  pending.forEach((t) => {
    let placed = false;
    for (let day = 0; day <= t.deadlineDay && !placed; day++) {
      const upperBound = day === t.deadlineDay
        ? Math.min(HOUR_END - t.duration + 1, t.deadlineHour - t.duration)
        : HOUR_END - t.duration + 1;
      for (let h = HOUR_START; h <= upperBound; h++) {
        if (canPlace(busySlots, occupied, day, h, t.duration, null)) {
          for (let i = 0; i < t.duration; i++) occupied[key(day, h + i)] = t.id;
          results[t.id] = { scheduledDay: day, scheduledStart: h, status: "scheduled" };
          placed = true;
          break;
        }
      }
    }
    if (!placed) results[t.id] = { scheduledDay: null, scheduledStart: null, status: "unscheduled" };
  });
  return results;
}

        {sub && <p className="text-xs" style={{ color: MUTED_LIGHT }}>{sub}</p>}
      </div>

}

function Toast({ toast, onClose }) {
  if (!toast) return null;

/* ---------------------------------------------------------------------- */
/*  Lịch chỉnh khung giờ bận — kéo chuột trực tiếp, chính xác tới 5 phút   */
/* ---------------------------------------------------------------------- */

function BusyEditorGrid({ busySlots, onCreateDraft, onSelectBlock }) {
  const rowH = 34;
  const labelW = 54;
  const pxPerMin = rowH / 60;
  const totalHeight = HOURS.length * rowH;
  const dragRef = useRef(null); // { day, startMin, top }
  const [draft, setDraft] = useState(null); // { day, s, e }

  const minuteAtY = (y) => {
    const raw = DAY_START_MIN + y / pxPerMin;
    return Math.min(DAY_END_MIN, Math.max(DAY_START_MIN, roundToStep(raw)));
  };

  const handleMouseDown = (day) => (e) => {
    if (e.target !== e.currentTarget) return; // bấm vào khối đã có, để onClick của khối đó xử lý
    const rect = e.currentTarget.getBoundingClientRect();
    const m = minuteAtY(e.clientY - rect.top);
    dragRef.current = { day, startMin: m, top: rect.top };
    setDraft({ day, s: m, e: m });
  };

  useEffect(() => {
    const handleMove = (e) => {
      if (!dragRef.current) return;
      const { day, startMin, top } = dragRef.current;
      const m = minuteAtY(e.clientY - top);
      setDraft({ day, s: Math.min(startMin, m), e: Math.max(startMin, m) });
    };
    const handleUp = () => {
      if (!dragRef.current) return;
      dragRef.current = null;
      setDraft((d) => {
        if (d && d.e - d.s >= TIME_STEP_MIN) onCreateDraft(d.day, d.s, d.e);
        return null;
      });
    };
    window.addEventListener("mousemove", handleMove);
    window.addEventListener("mouseup", handleUp);
    return () => {
      window.removeEventListener("mousemove", handleMove);
      window.removeEventListener("mouseup", handleUp);
    };
  }, [onCreateDraft]);

  return (
    <div className="overflow-x-auto">
      <div className="flex select-none" style={{ minWidth: 640 }}>
        <div style={{ width: labelW, flexShrink: 0 }}>
          <div style={{ height: 24 }} />
          <div style={{ position: "relative", height: totalHeight }}>
            {HOURS.map((h) => (
              <div key={h} style={{ position: "absolute", top: (h - HOUR_START) * rowH - 6, right: 6, fontSize: 11, color: MUTED_LIGHT }}>{h}:00</div>
            ))}
            <div style={{ position: "absolute", top: totalHeight - 6, right: 6, fontSize: 11, color: MUTED_LIGHT }}>{HOUR_END + 1}:00</div>
          </div>
        </div>
        {DAYS.map((d, di) => (
          <div key={d.short} style={{ flex: 1, minWidth: 64 }}>
            <div className="flex items-end justify-center pb-1 text-xs font-semibold" style={{ height: 24, color: PRIMARY, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>{d.short}</div>
            <div
              onMouseDown={handleMouseDown(di)}
              style={{
                position: "relative", height: totalHeight, cursor: "crosshair",
                backgroundColor: "#FFFCFD",
                backgroundImage: `repeating-linear-gradient(to bottom, #FBEAF1 0, #FBEAF1 1px, transparent 1px, transparent ${rowH}px)`,
                borderLeft: di === 0 ? "1px solid #FBEAF1" : "1px solid #FDF3F7",
                borderRight: "1px solid #FDF3F7",
              }}
            >
              {(busySlots[di] || []).map((b) => (
                <div
                  key={b.id}
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={(e) => { e.stopPropagation(); onSelectBlock(di, b); }}
                  title={b.note || "Bận"}
                  className="absolute left-0.5 right-0.5 cursor-pointer overflow-hidden rounded-md border px-1.5 py-0.5 text-[10.5px] leading-tight hover:brightness-95"
                  style={{ top: (b.s - DAY_START_MIN) * pxPerMin, height: Math.max(8, (b.e - b.s) * pxPerMin), backgroundColor: "#FBD9E7", borderColor: DANGER, color: "#7A3348" }}
                >
                  <span className="font-semibold">{minToHHMM(b.s)}–{minToHHMM(b.e)}</span>
                  {b.note && <div className="truncate opacity-80">{b.note}</div>}
                </div>
              ))}
              {draft && draft.day === di && (
                <div
                  className="absolute left-0.5 right-0.5 rounded-md border-2 border-dashed"
                  style={{ top: (draft.s - DAY_START_MIN) * pxPerMin, height: Math.max(4, (draft.e - draft.s) * pxPerMin), borderColor: PRIMARY, backgroundColor: "#FDE3EE99" }}
                />
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function DashboardView({ busySlots, tasks, onDropTask }) {
  const [selectedTaskId, setSelectedTaskId] = useState(null);
  const selectedTask = tasks.find((t) => t.id === selectedTaskId) || null;

  const totalFreeMin = totalFreeMinutes(busySlots);
  const scheduled = tasks.filter((t) => t.status === "scheduled");
  const scheduledHours = scheduled.reduce((s, t) => s + t.duration, 0);
  const unscheduledCount = tasks.filter((t) => t.status === "unscheduled").length;
  const utilization = totalFreeMin ? Math.round(((scheduledHours * 60) / totalFreeMin) * 100) : 0;

  const perDay = DAYS.map((d, di) => {
    const free = freeMinutesForDay(busySlots, di) / 60;
    const busy = scheduled.filter((t) => t.scheduledDay === di).reduce((s, t) => s + t.duration, 0);
    return { ...d, free, busy };
  });
  const maxHours = Math.max(1, ...perDay.map((d) => Math.max(d.free, d.busy + d.free)));

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <StatCard icon={Clock3} label="Giờ rảnh / tuần" value={formatDuration(totalFreeMin)} accent={PRIMARY} />
        <StatCard icon={CalendarClock} label="Đã sắp xếp" value={`${scheduledHours}h`} sub={`${scheduled.length} việc`} accent={SECONDARY} />
        <StatCard icon={LayoutGrid} label="Tỷ lệ sử dụng" value={`${utilization}%`} accent={PURPLE} />
        <StatCard icon={AlertTriangle} label="Chưa sắp xếp được" value={unscheduledCount} sub={unscheduledCount ? "cần điều chỉnh" : "ổn"} accent={DANGER} />
      </div>

      <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <p className="mb-3 text-sm font-medium" style={{ color: INK }}>Thời gian rảnh & đã dùng theo ngày</p>
        <div className="space-y-2">
          {perDay.map((d) => (
            <div key={d.short} className="flex items-center gap-3">
              <span className="w-9 text-xs" style={{ color: MUTED }}>{d.short}</span>
              <div className="relative h-4 flex-1 overflow-hidden rounded-full" style={{ backgroundColor: "#FBEAF1" }}>
                <div className="absolute inset-y-0 left-0 rounded-full" style={{ width: `${(d.free / maxHours) * 100}%`, backgroundColor: "#FBD9E7" }} />
                <div className="absolute inset-y-0 left-0 rounded-full" style={{ width: `${(d.busy / maxHours) * 100}%`, backgroundColor: SECONDARY }} />
              </div>
              <span className="w-20 text-right text-[11px]" style={{ color: MUTED_LIGHT }}>{d.busy}h / {formatDuration(d.free * 60)}</span>
            </div>
          ))}
        </div>
        <div className="mt-3 flex items-center gap-4 text-[11px]" style={{ color: MUTED }}>
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: "#FBD9E7" }} /> Rảnh</span>
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: SECONDARY }} /> Đã sắp lịch</span>
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <div className="mb-3 flex items-center justify-between">
          <p className="text-sm font-medium" style={{ color: INK }}>Lịch tuần — kéo khối việc để đổi giờ</p>
          {selectedTask && <span className="text-xs" style={{ color: MUTED }}>Đang chọn: <b style={{ color: catOf(selectedTask.category).text }}>{selectedTask.name}</b></span>}
        </div>
        <WeekGrid busySlots={busySlots} tasks={tasks} onDropTask={(day, hour) => onDropTask(selectedTaskId, day, hour)} selectedTaskId={selectedTaskId} onSelectTask={setSelectedTaskId} />
      </div>
    </div>
  );
}

            const [cs, ce] = clampRange(s, e);

            const newId = uid();

            setEditing({ day, id: newId, s: cs, e: ce, note: "", isDraft: true });
          }}
          onSelectBlock={(day, block) => setEditing({ day, id: block.id, s: block.s, e: block.e, note: block.note || "" })}

/* ---------------------------------------------------------------------- */
/*  Form thêm/sửa 1 khối "khung giờ bận" — có ghi chú đang bận việc gì     */
/* ---------------------------------------------------------------------- */

function BusyBlockForm({ editing, setEditing, setBusySlots, notify }) {
  if (!editing) {
    return (
      <div className="rounded-2xl border border-dashed p-4 text-center text-xs" style={{ borderColor: BORDER, color: MUTED }}>
        Kéo chuột trên lịch phía trên để đánh dấu khung giờ bận (chính xác tới 5 phút), hoặc bấm vào một khung đã đánh dấu để sửa / xoá.
      </div>
    );
  }

  const { day, id, s, e, note } = editing;
  const setField = (patch) => setEditing((prev) => ({ ...prev, ...patch }));

  const save = () => {
    if (editing.e <= editing.s) { notify("Giờ kết thúc phải sau giờ bắt đầu.", "error"); return; }
    if (editing.s < DAY_START_MIN || editing.e > DAY_END_MIN) {
      notify(`Chỉ có thể chọn trong khung ${minToHHMM(DAY_START_MIN)} – ${minToHHMM(DAY_END_MIN)}.`, "error");
      return;
    }
    if (id) {
      setBusySlots((prev) => updateBusyBlock(prev, day, id, { s: editing.s, e: editing.e, note: editing.note.trim() }));
      notify("Đã cập nhật khung giờ bận.", "success");
    } else {
      setBusySlots((prev) => addBusyBlock(prev, day, editing.s, editing.e, editing.note));
      notify(`Đã đánh dấu bận ${minToHHMM(editing.s)} – ${minToHHMM(editing.e)}.`, "success");
    }
    setEditing(null);
  };

  const remove = () => {
    setBusySlots((prev) => removeBusyBlock(prev, day, id));
    notify("Đã xoá khung giờ bận.", "success");
    setEditing(null);
  };

  return (
    <div className="rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
      <p className="mb-3 text-sm font-medium" style={{ color: INK }}>{editing.isDraft ? "Khung giờ bận mới" : "Sửa khung giờ bận"} — {DAYS[day].full}</p>
      <div className="flex flex-wrap items-end gap-2">
        <div>
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Bắt đầu</label>
          <input type="time" step={TIME_STEP_MIN * 60} value={minToHHMM(editing.s)} onChange={(ev) => setField({ s: roundToStep(hhmmToMin(ev.target.value)) })} className="rounded-xl border px-2 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }} />
        </div>
        <div>
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Kết thúc</label>
          <input type="time" step={TIME_STEP_MIN * 60} value={minToHHMM(editing.e)} onChange={(ev) => setField({ e: roundToStep(hhmmToMin(ev.target.value)) })} className="rounded-xl border px-2 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }} />
        </div>
        <div className="min-w-[180px] flex-1">
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Đang bận việc gì?</label>
          <input value={editing.note} onChange={(ev) => setField({ note: ev.target.value })} placeholder="VD: Dạy lớp HSK3" className="w-full rounded-xl border px-3 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }} />
        </div>
        <button onClick={save} className="flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold text-white" style={{ backgroundColor: SECONDARY, color: "#5A4405", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
          <CheckCircle2 size={14} /> Lưu
        </button>
        {id && (
          <button onClick={remove} className="flex items-center gap-1.5 rounded-full border px-3 py-2 text-xs font-medium hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: DANGER }}>
            <Trash2 size={13} /> Xoá
          </button>
        )}
        <button
          onClick={() => {
            // Nếu đang huỷ 1 khối vừa kéo (chưa từng lưu ghi chú), xoá luôn
            // khối đó thay vì để lại 1 khung giờ bận trống không mong muốn.
            if (editing.isDraft) setBusySlots((prev) => removeBusyBlock(prev, day, id));
            setEditing(null);
          }}
          className="rounded-full border px-3 py-2 text-xs font-medium hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: "#8A6070" }}
        >
          Huỷ
        </button>
      </div>
    </div>
  );
}

function AssistantView({ tasks, setTasks, busySlots, notify }) {
  const [form, setForm] = useState({ name: "", category: "hoc", duration: 1, deadlineDay: 4, deadlineHour: 18 });

  const addTask = () => {
    if (!form.name.trim()) { notify("Nhập tên việc cần làm trước đã nhé.", "error"); return; }
    if (form.deadlineHour - form.duration < HOUR_START) { notify("Deadline quá sớm so với thời lượng, hãy chọn giờ muộn hơn.", "error"); return; }
    setTasks((prev) => [...prev, { id: uid(), name: form.name.trim(), category: form.category, duration: Number(form.duration), deadlineDay: Number(form.deadlineDay), deadlineHour: Number(form.deadlineHour), status: "pending", scheduledDay: null, scheduledStart: null }]);
    setForm((f) => ({ ...f, name: "" }));
  };
  const removeTask = (id) => setTasks((prev) => prev.filter((t) => t.id !== id));
  const unschedule = (id) => setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status: "pending", scheduledDay: null, scheduledStart: null } : t)));

  const runAuto = () => {
    const results = autoSchedule(tasks, busySlots);
    const ids = Object.keys(results);
    if (!ids.length) { notify("Không có việc nào đang chờ sắp xếp.", "error"); return; }
    setTasks((prev) => prev.map((t) => (results[t.id] ? { ...t, ...results[t.id] } : t)));
    const okCount = Object.values(results).filter((r) => r.status === "scheduled").length;
    const failCount = ids.length - okCount;
    notify(failCount ? `Đã sắp xếp ${okCount} việc, còn ${failCount} việc chưa tìm được chỗ trống phù hợp.` : `Đã sắp xếp thành công ${okCount} việc vào thời gian rảnh.`, failCount ? "error" : "success");
  };

  const pending = tasks.filter((t) => t.status !== "scheduled");
  const scheduled = tasks.filter((t) => t.status === "scheduled");

  return (
    <div className="grid gap-6 lg:grid-cols-[340px_1fr]">
      <div className="h-fit space-y-3 rounded-2xl border p-4" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <p className="flex items-center gap-2 text-sm font-medium" style={{ color: INK }}><PenSquare size={15} /> Thêm việc cần làm</p>
        <div>
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Tên lớp học / việc cần làm</label>
          <input value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} onKeyDown={(e) => { if (e.key === "Enter") addTask(); }} placeholder="VD: Ôn tập HSK4, Bài tập Toán..." className="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: BORDER, color: INK }} />
        </div>
        <div>
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Phân loại</label>
          <select value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }}>
            {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Thời lượng (giờ)</label>
            <select value={form.duration} onChange={(e) => setForm((f) => ({ ...f, duration: e.target.value }))} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }}>
              {[1, 2, 3, 4, 5, 6].map((n) => <option key={n} value={n}>{n}h</option>)}
            </select>
          </div>
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Hạn chót — ngày</label>
            <select value={form.deadlineDay} onChange={(e) => setForm((f) => ({ ...f, deadlineDay: e.target.value }))} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }}>
              {DAYS.map((d, i) => <option key={d.short} value={i}>{d.full}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="mb-1 block text-xs" style={{ color: MUTED }}>Hạn chót — trước giờ</label>
          <select value={form.deadlineHour} onChange={(e) => setForm((f) => ({ ...f, deadlineHour: e.target.value }))} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" style={{ borderColor: BORDER, color: INK }}>
            {Array.from({ length: 18 }, (_, i) => HOUR_START + 1 + i).map((h) => <option key={h} value={h}>{h}:00</option>)}
          </select>
        </div>
        <button onClick={addTask} className="flex w-full items-center justify-center gap-1.5 rounded-full py-2 text-sm font-semibold text-white" style={{ backgroundColor: PRIMARY, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
          <Plus size={15} /> Thêm vào danh sách
        </button>
      </div>

      <div className="space-y-5">
        <div className="flex items-center justify-between">
          <p className="flex items-center gap-2 text-sm font-medium" style={{ color: INK }}><ListChecks size={15} /> Danh sách chờ sắp xếp ({pending.length})</p>
          <button onClick={runAuto} className="flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold text-white" style={{ backgroundColor: SECONDARY, color: "#5A4405", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
            <Sparkles size={15} /> Sắp xếp thông minh
          </button>
        </div>

        {pending.length === 0 ? (
          <div className="flex flex-col items-center gap-2 rounded-2xl border border-dashed p-8 text-center" style={{ borderColor: BORDER }}>
            <Flower size={30} petal={PRIMARY} center={SECONDARY} />
            <p className="text-sm" style={{ color: MUTED }}>Chưa có việc nào đang chờ. Thêm việc ở form bên trái nhé.</p>
          </div>
        ) : (
          <div className="space-y-2">
            {pending.map((t) => {
              const c = catOf(t.category);
              return (
                <div key={t.id} className="flex items-center justify-between rounded-xl border px-3 py-2.5" style={{ borderColor: t.status === "unscheduled" ? "#F3C1CE" : BORDER, backgroundColor: t.status === "unscheduled" ? "#FEF2F5" : CARD }}>
                  <div className="flex items-center gap-2.5">
                    <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: c.border }} />
                    <div>
                      <p className="text-sm font-medium" style={{ color: INK }}>{t.name}</p>
                      <p className="text-[11px]" style={{ color: MUTED_LIGHT }}>
                        {c.label} · {t.duration}h · hạn {DAYS[t.deadlineDay].full} {t.deadlineHour}:00
                        {t.status === "unscheduled" && <span style={{ color: DANGER }}> · chưa tìm được chỗ trống</span>}
                      </p>
                    </div>
                  </div>
                  <button onClick={() => removeTask(t.id)} className="rounded p-1.5 hover:bg-black/5" style={{ color: MUTED_LIGHT }}><Trash2 size={15} /></button>
                </div>
              );
            })}
          </div>
        )}

        <p className="pt-2 text-sm font-medium" style={{ color: INK }}>Đã sắp xếp ({scheduled.length})</p>
        {scheduled.length === 0 ? (
          <p className="text-xs" style={{ color: MUTED_LIGHT }}>Chưa có việc nào được sắp lịch.</p>
        ) : (
          <div className="space-y-2">
            {scheduled.map((t) => {
              const c = catOf(t.category);
              return (
                <div key={t.id} className="flex items-center justify-between rounded-xl border px-3 py-2.5" style={{ borderColor: BORDER }}>
                  <div className="flex items-center gap-2.5">
                    <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: c.border }} />
                    <div>
                      <p className="text-sm font-medium" style={{ color: INK }}>{t.name}</p>
                      <p className="text-[11px]" style={{ color: MUTED_LIGHT }}>{DAYS[t.scheduledDay].full} · {t.scheduledStart}:00 – {t.scheduledStart + t.duration}:00</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button onClick={() => unschedule(t.id)} className="rounded px-2 py-1 text-[11px] font-medium hover:bg-black/5" style={{ color: "#8A6070" }}>Bỏ lịch</button>
                    <button onClick={() => removeTask(t.id)} className="rounded p-1.5 hover:bg-black/5" style={{ color: MUTED_LIGHT }}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function AuthScreen({ notify }) {
  const [mode, setMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const switchMode = (m) => { setMode(m); setError(""); };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email.trim() || !password) { setError("Vui lòng nhập đầy đủ email và mật khẩu."); return; }
    setBusy(true);
    try {
      if (mode === "signin") {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      } else {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally {
      setBusy(false);
    }
  };

  const handleGoogle = async () => {
    setError("");
    setBusy(true);
    try {
      await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch (err) {
      setError(mapAuthError(err.code));
    } finally {
      setBusy(false);
    }
  };

  const handleForgot = async () => {
    setError("");
    if (!email.trim()) { setError("Nhập email của bạn vào ô bên trên trước, rồi bấm lại \"Quên mật khẩu?\"."); return; }
    try {
      await auth.sendPasswordResetEmail(email.trim());
      notify("Đã gửi email đặt lại mật khẩu, hãy kiểm tra hộp thư.", "success");
    } catch (err) {
      setError(mapAuthError(err.code));
    }
  };

  return (
    <AuthBackdrop>
      <div className="relative z-10 w-full max-w-sm rounded-3xl border p-6 shadow-sm" style={{ borderColor: BORDER, backgroundColor: CARD }}>
        <div className="mb-5 flex flex-col items-center gap-1 text-center">
          <Flower size={34} petal={PRIMARY} center={SECONDARY} />
          <h1 className="text-2xl font-extrabold" style={{ fontFamily: "'Baloo 2', system-ui, sans-serif", color: PRIMARY, letterSpacing: "0.5px" }}>TNTime</h1>
          <p className="text-xs" style={{ color: MUTED }}>{mode === "signin" ? "Đăng nhập để tiếp tục" : "Tạo tài khoản mới"}</p>
        </div>

        <div className="mb-4 flex gap-1 rounded-full border p-1" style={{ borderColor: BORDER }}>
          <button type="button" onClick={() => switchMode("signin")} className="flex-1 rounded-full py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: mode === "signin" ? PRIMARY : "transparent", color: mode === "signin" ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>Đăng nhập</button>
          <button type="button" onClick={() => switchMode("signup")} className="flex-1 rounded-full py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: mode === "signup" ? PRIMARY : "transparent", color: mode === "signup" ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>Đăng ký</button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-3">
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Email</label>
            <input type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: BORDER, color: INK }} placeholder="ban@gmail.com" />
          </div>
          <div>
            <label className="mb-1 block text-xs" style={{ color: MUTED }}>Mật khẩu</label>
            <input type="password" autoComplete={mode === "signin" ? "current-password" : "new-password"} value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") handleSubmit(e); }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: BORDER, color: INK }} placeholder="Tối thiểu 6 ký tự" />
          </div>
          {error && (
            <p className="flex items-center gap-1.5 text-xs" style={{ color: DANGER }}><AlertTriangle size={13} />{error}</p>
          )}
          <button type="submit" disabled={busy} className="flex w-full items-center justify-center gap-1.5 rounded-full py-2 text-sm font-semibold text-white disabled:opacity-60" style={{ backgroundColor: PRIMARY, fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
            {busy ? "Đang xử lý..." : mode === "signin" ? "Đăng nhập" : "Tạo tài khoản"}
          </button>
        </form>

        {mode === "signin" && (
          <button type="button" onClick={handleForgot} className="mt-2 w-full text-center text-[11px] hover:underline" style={{ color: MUTED }}>Quên mật khẩu?</button>
        )}

        <div className="my-4 flex items-center gap-2">
          <div className="h-px flex-1" style={{ backgroundColor: BORDER }} />
          <span className="text-[11px]" style={{ color: MUTED_LIGHT }}>hoặc</span>
          <div className="h-px flex-1" style={{ backgroundColor: BORDER }} />
        </div>

        <button type="button" onClick={handleGoogle} disabled={busy} className="flex w-full items-center justify-center gap-2 rounded-full border py-2 text-sm font-medium disabled:opacity-60" style={{ borderColor: BORDER, color: INK, backgroundColor: "#FFFFFF" }}>
          <GoogleGlyph /> Đăng nhập bằng Google
        </button>
      </div>
    </AuthBackdrop>
  );
}

const TABS = [
  { id: "dashboard", label: "Tổng quan", icon: LayoutGrid },
  { id: "slots", label: "Khung giờ bận", icon: Clock3 },
  { id: "assistant", label: "Trợ lý sắp xếp", icon: Sparkles },
];

function App() {
  const [user, setUser] = useState(undefined); // undefined = đang kiểm tra, null = chưa đăng nhập
  const [view, setView] = useState("dashboard");
  const [busySlots, setBusySlots] = useState({});
  const [tasks, setTasks] = useState([]);
  const [dataLoading, setDataLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const skipNextSave = useRef(false);
  const saveTimer = useRef(null);

  const notify = useCallback((message, type = "success") => setToast({ message, type, id: uid() }), []);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);

  /* Theo dõi trạng thái đăng nhập */
  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  /* Khi có người dùng đăng nhập: tải dữ liệu của họ từ Firestore.
     Nếu là lần đầu (chưa có tài liệu trên Firestore), dùng tạm dữ liệu
     localStorage cũ trên trình duyệt này (nếu có) làm dữ liệu khởi đầu,
     để không mất dữ liệu đã nhập trước khi có tính năng đăng nhập. */
  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    setDataLoading(true);
    const ref = db.collection("users").doc(user.uid);
    ref.get().then((snap) => {
      if (cancelled) return;
      if (snap.exists) {
        const data = snap.data() || {};
        if (data.busySlots) {
          const loadedBusy = normalizeLoadedBusySlots(data.busySlots);
          skipNextSave.current = true;
          setBusySlots(loadedBusy);
          setTasks(data.tasks || []);
        } else {
          // Dữ liệu cũ chỉ có "freeSlots" (khung giờ rảnh) — chuyển sang mô
          // hình "khung giờ bận" mới bằng phần bù, rồi lưu lại luôn.
          const oldFree = normalizeLoadedFreeIntervals(data.freeSlots || {});
          const migratedBusy = migrateFreeToBusySlots(oldFree);
          skipNextSave.current = true;
          setBusySlots(migratedBusy);
          setTasks(data.tasks || []);
          ref.set({ busySlots: migratedBusy }, { merge: true }).catch(() => {});
        }
      } else {
        const rawInitFree = loadLS(LS_FREE, null);
        const initBusy = rawInitFree ? migrateFreeToBusySlots(normalizeLoadedFreeIntervals(rawInitFree)) : {};
        const initTasks = loadLS(LS_TASKS, null) || [];
        skipNextSave.current = true;
        setBusySlots(initBusy);
        setTasks(initTasks);
        ref.set({
          busySlots: initBusy,
          tasks: initTasks,
          email: user.email || null,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }).catch(() => {});
      }
      setDataLoading(false);
    }).catch(() => {
      if (cancelled) return;
      notify("Không tải được dữ liệu từ máy chủ, hãy thử tải lại trang.", "error");
      setDataLoading(false);
    });
    return () => { cancelled = true; };
  }, [user]);

  /* Lưu lên Firestore mỗi khi dữ liệu thay đổi (gộp các thay đổi liên tiếp
     trong ~600ms để tránh ghi quá nhiều lần). */
  useEffect(() => {
    if (!user || dataLoading) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      db.collection("users").doc(user.uid).set({
        busySlots, tasks,
        email: user.email || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true }).then(() => {
        setJustSaved(true);
        setTimeout(() => setJustSaved(false), 900);
      }).catch(() => notify("Lưu dữ liệu thất bại, kiểm tra kết nối mạng.", "error"));
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [busySlots, tasks, user, dataLoading]);

  const handleLogout = async () => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    await auth.signOut();
    setBusySlots({});
    setTasks([]);
    setDataLoading(true);
  };

  const handleDropTask = (taskId, day, hour) => {
    if (!taskId) return;
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    const occupied = buildOccupied(tasks, task.id);
    if (hour + task.duration - 1 > HOUR_END || !canPlace(busySlots, occupied, day, hour, task.duration, task.id)) {
      notify("Không thể đặt vào đây — trùng lịch hoặc đã bị đánh dấu bận.", "error");
      return;
    }
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, status: "scheduled", scheduledDay: day, scheduledStart: hour } : t)));
  };

  const resetAllData = () => {
    if (!window.confirm("Xoá toàn bộ dữ liệu đã lưu (khung giờ bận + việc cần làm)?")) return;
    setBusySlots({});
    setTasks([]);
    notify("Đã xoá toàn bộ dữ liệu.", "success");
  };

  if (user === undefined) return <LoadingScreen label="Đang kiểm tra đăng nhập..." />;
  if (user === null) return <AuthScreen notify={notify} />;
  if (dataLoading) return <LoadingScreen label="Đang tải dữ liệu của bạn..." />;

  return (
    <div className="relative min-h-screen w-full" style={{ backgroundColor: "#FFF6FA", fontFamily: "'Inter', system-ui, sans-serif" }}>
      {/* soft decorative background blobs */}
      <div className="bg-blob" style={{ width: 320, height: 320, top: -120, left: -100, background: "radial-gradient(circle, #FDE3EE 0%, rgba(253,227,238,0) 70%)" }} />
      <div className="bg-blob" style={{ width: 280, height: 280, bottom: -100, right: -80, background: "radial-gradient(circle, #FFF1D6 0%, rgba(255,241,214,0) 70%)" }} />
      <div className="bg-blob" style={{ width: 220, height: 220, top: "40%", right: -110, background: "radial-gradient(circle, #EFE6FA 0%, rgba(239,230,250,0) 70%)" }} />

      <header className="relative overflow-hidden border-b" style={{ borderColor: BORDER, background: "linear-gradient(180deg, #FDEDF4 0%, #FFF6FA 100%)" }}>
        <Cloud size={110} color="#FFFFFF" opacity={0.9} className="float-slow" style={{ position: "absolute", top: 10, left: 18 }} />
        <Cloud size={70} color="#FFFFFF" opacity={0.8} className="float-slower" style={{ position: "absolute", top: 30, left: 130 }} />
        <Rainbow size={130} opacity={0.85} style={{ position: "absolute", top: -10, right: 24 }} />

        <div className="relative z-10 mx-auto flex max-w-5xl flex-col gap-4 px-5 py-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 className="text-3xl font-extrabold" style={{ fontFamily: "'Baloo 2', system-ui, sans-serif", color: PRIMARY, letterSpacing: "0.5px" }}>TNTime</h1>
            <p className="flex flex-wrap items-center gap-1.5 text-xs" style={{ color: "#9C6B80" }}>
              Tự động tối ưu thời gian trống trong tuần
              <span className="flex items-center gap-1" style={{ color: justSaved ? PRIMARY : "#E3B9CB", transition: "color .3s" }}>
                <Save size={11} /> {justSaved ? "đã lưu" : "tự động lưu"}
              </span>
              {user?.email && <span style={{ color: MUTED_LIGHT }}>· {user.email}</span>}
            </p>
          </div>
          <div className="flex items-center gap-2">
            <nav className="flex gap-1 rounded-full border p-1" style={{ borderColor: BORDER, backgroundColor: "#FFFFFF" }}>
              {TABS.map((t) => {
                const active = view === t.id;
                const Icon = t.icon;
                return (
                  <button key={t.id} onClick={() => setView(t.id)} className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors" style={{ backgroundColor: active ? PRIMARY : "transparent", color: active ? "#FFFFFF" : "#8A6070", fontFamily: "'Baloo 2', system-ui, sans-serif" }}>
                    <Icon size={14} />{t.label}
                  </button>
                );
              })}
            </nav>
            <button onClick={resetAllData} title="Xoá toàn bộ dữ liệu đã lưu" className="rounded-full border p-2 hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: MUTED_LIGHT, backgroundColor: "#FFFFFF" }}>
              <RotateCcw size={15} />
            </button>
            <button onClick={handleLogout} title="Đăng xuất" className="rounded-full border p-2 hover:bg-[#FFF6FA]" style={{ borderColor: BORDER, color: MUTED_LIGHT, backgroundColor: "#FFFFFF" }}>
              <XIcon size={15} />
            </button>
          </div>
        </div>
        <FlowerDivider />
      </header>

      <main className="relative z-10 mx-auto max-w-5xl px-5 py-6">
        {view === "dashboard" && <DashboardView busySlots={busySlots} tasks={tasks} onDropTask={handleDropTask} />}
        {view === "slots" && <SlotEditorView busySlots={busySlots} setBusySlots={setBusySlots} notify={notify} />}
        {view === "assistant" && <AssistantView tasks={tasks} setTasks={setTasks} busySlots={busySlots} notify={notify} />}
      </main>

      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
